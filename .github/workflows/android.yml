name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build release APK
        working-directory: android
        run: gradle :app:assembleRelease --stacktrace
      - name: Prepare APK name
        run: cp android/app/build/outputs/apk/release/app-release.apk VyperiaLagSwitch-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VyperiaLagSwitch-Android
          path: VyperiaLagSwitch-Android.apk
      - name: Publish Android release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v1.0.1 >/dev/null 2>&1; then
            gh release upload android-v1.0.1 VyperiaLagSwitch-Android.apk --clobber
          else
            gh release create android-v1.0.1 VyperiaLagSwitch-Android.apk \
              --target "$GITHUB_SHA" \
              --title "Android v1.0.1" \
              --notes "Android v1.0.1 fixes the missing launcher icon, makes the floating overlay request Android VPN permission when needed, clamps the draggable overlay inside the current screen in portrait and landscape, and renders installed app icons in the Target selector. Includes whole-system/per-app packet blackholing, anti-timeout cycling, pause/reactivation controls, overlay customization, and notification quick toggle."
          fi
