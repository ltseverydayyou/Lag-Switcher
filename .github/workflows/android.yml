name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build release APK
        working-directory: android
        run: gradle :app:assembleRelease --stacktrace
      - name: Prepare APK name
        run: cp android/app/build/outputs/apk/release/app-release.apk VyperiaLagSwitch-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VyperiaLagSwitch-Android
          path: VyperiaLagSwitch-Android.apk
      - name: Publish Android release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v1.0.0 >/dev/null 2>&1; then
            gh release upload android-v1.0.0 VyperiaLagSwitch-Android.apk --clobber
          else
            gh release create android-v1.0.0 VyperiaLagSwitch-Android.apk \
              --target "$GITHUB_SHA" \
              --title "Android v1.0.0" \
              --notes "First Android release of Vyperia Lag Switch. Uses Android VpnService to blackhole network packets without disabling Wi-Fi or mobile data. Includes whole-system and per-app targeting, draggable floating overlay controls, anti-timeout cycling, reactivate-after-pause, configurable active/pause durations, compact overlay mode, position, size, ON/OFF colors, and notification quick toggle. No root required. Android only permits one ordinary VpnService at a time, so this build cannot run alongside another VPN app."
          fi
