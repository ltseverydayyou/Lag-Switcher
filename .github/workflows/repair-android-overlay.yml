name: Repair Android overlay features

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and patch Android overlay files
        shell: bash
        run: |
          git show f00e6300804c45f96b3d59bef328e62c91f4bbd7:android/app/src/main/java/com/vyperia/lagswitch/LagSwitchService.java > android/app/src/main/java/com/vyperia/lagswitch/LagSwitchService.java
          git show f00e6300804c45f96b3d59bef328e62c91f4bbd7:android/app/src/main/java/com/vyperia/lagswitch/MainActivity.java > android/app/src/main/java/com/vyperia/lagswitch/MainActivity.java
          python3 <<'PY'
          from pathlib import Path

          service = Path('android/app/src/main/java/com/vyperia/lagswitch/LagSwitchService.java')
          s = service.read_text()
          old = '''                    case MotionEvent.ACTION_MOVE:\n                        float dx = event.getRawX() - startTouchX;\n'''
          new = '''                    case MotionEvent.ACTION_MOVE:\n                        if (prefs.getBoolean("overlay_freeze_position", false)) return true;\n                        float dx = event.getRawX() - startTouchX;\n'''
          if old not in s:
              raise SystemExit('LagSwitchService drag block not found')
          s = s.replace(old, new, 1)
          old = '''        overlay.setBackgroundTintList(android.content.res.ColorStateList.valueOf(colorFor(colorName)));\n'''
          new = '''        int backgroundColor = colorFor(colorName);\n        if (prefs.getBoolean("overlay_transparent", false)) {\n            backgroundColor = Color.argb(90, Color.red(backgroundColor), Color.green(backgroundColor), Color.blue(backgroundColor));\n        }\n        overlay.setBackgroundTintList(android.content.res.ColorStateList.valueOf(backgroundColor));\n'''
          if old not in s:
              raise SystemExit('LagSwitchService color block not found')
          service.write_text(s.replace(old, new, 1))

          main = Path('android/app/src/main/java/com/vyperia/lagswitch/MainActivity.java')
          s = main.read_text()
          old = '''    private CheckBox compactOverlay;\n'''
          new = '''    private CheckBox compactOverlay;\n    private CheckBox transparentOverlay;\n    private CheckBox freezeOverlayPosition;\n'''
          if old not in s:
              raise SystemExit('MainActivity field block not found')
          s = s.replace(old, new, 1)
          old = '''        overlayCard.addView(compactOverlay);\n\n        overlaySizeLabel = text("Overlay text size", 14, TEXT);\n'''
          new = '''        overlayCard.addView(compactOverlay);\n\n        transparentOverlay = checkbox("Transparent floating button");\n        transparentOverlay.setOnCheckedChangeListener((b, checked) -> {\n            prefs.edit().putBoolean("overlay_transparent", checked).apply();\n            sendServiceIfRunning(LagSwitchService.ACTION_RELOAD);\n        });\n        overlayCard.addView(transparentOverlay);\n\n        freezeOverlayPosition = checkbox("Freeze floating button position");\n        freezeOverlayPosition.setOnCheckedChangeListener((b, checked) -> {\n            prefs.edit().putBoolean("overlay_freeze_position", checked).apply();\n            sendServiceIfRunning(LagSwitchService.ACTION_RELOAD);\n        });\n        overlayCard.addView(freezeOverlayPosition);\n\n        overlaySizeLabel = text("Overlay text size", 14, TEXT);\n'''
          if old not in s:
              raise SystemExit('MainActivity overlay controls insertion point not found')
          s = s.replace(old, new, 1)
          old = '''        TextView hint = text("Tap the floating button to toggle. Drag it anywhere. Long-press it to reopen this screen.", 13, MUTED);\n'''
          new = '''        TextView hint = text("Tap the floating button to toggle. Drag it anywhere unless its position is frozen. Long-press it to reopen this screen.", 13, MUTED);\n'''
          if old not in s:
              raise SystemExit('MainActivity hint not found')
          s = s.replace(old, new, 1)
          old = '''        compactOverlay.setChecked(prefs.getBoolean("overlay_compact", false));\n'''
          new = '''        compactOverlay.setChecked(prefs.getBoolean("overlay_compact", false));\n        transparentOverlay.setChecked(prefs.getBoolean("overlay_transparent", false));\n        freezeOverlayPosition.setChecked(prefs.getBoolean("overlay_freeze_position", false));\n'''
          if old not in s:
              raise SystemExit('MainActivity load settings block not found')
          main.write_text(s.replace(old, new, 1))
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "Vyperia"
          git config user.email "117316014+ltseverydayyou@users.noreply.github.com"
          git add android/app/src/main/java/com/vyperia/lagswitch/LagSwitchService.java android/app/src/main/java/com/vyperia/lagswitch/MainActivity.java
          git commit -m "Add transparent and freeze modes for Android floating button"
          git push origin HEAD:main
